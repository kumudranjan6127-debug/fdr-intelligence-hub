name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fdr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The app database is never used in CI; it only has to differ from the throwaway test database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fdr_app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/fdr_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fdr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (real services + Postgres)
        run: npm run test:int
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: End-to-end tests (browser)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
